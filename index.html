<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>著作権ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* Layout: one game column — chunky 3D buttons, a fixed bottom action bar that becomes the feedback sheet, category colors carried by round kanji badges */
:root{
  --bg:#F4F8FC; --card:#FFFFFF; --ink:#24313F; --muted:#6C7A89; --line:#DCE5EE; --line-d:#C3D0DC;
  --sky:#1CA7EC; --sky-d:#0E86C2; --sky-t:#DDF2FD;
  --sun:#FFC23D; --sun-d:#E09A00; --sun-t:#FFF3D3;
  --mint:#22C39A; --mint-d:#139A77; --mint-t:#D8F7EE;
  --coral:#FF5C64; --coral-d:#D83B44; --coral-t:#FFE3E4;
  --grape:#8D6BF0; --grape-d:#6A47CF; --grape-t:#ECE6FE;
  --on:#FFFFFF;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A23; --card:#1B2632; --ink:#EEF3F8; --muted:#97A6B5; --line:#2C3A49; --line-d:#3A4B5D;
  --sky-t:#123447; --sun-t:#3A2F14; --mint-t:#113A30; --coral-t:#40191C; --grape-t:#2A2147; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A23; --card:#1B2632; --ink:#EEF3F8; --muted:#97A6B5; --line:#2C3A49; --line-d:#3A4B5D;
  --sky-t:#123447; --sun-t:#3A2F14; --mint-t:#113A30; --coral-t:#40191C; --grape-t:#2A2147; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;font-weight:500}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:18px}

/* 3D buttons */
.btn{--c:var(--sky);--cd:var(--sky-d);border:0;border-radius:16px;background:var(--c);color:var(--on);font-weight:800;font-size:1.05rem;letter-spacing:.06em;padding:14px 18px;box-shadow:0 5px 0 var(--cd);transition:transform .06s,box-shadow .06s,filter .15s;width:100%}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--cd)}
.btn:disabled{--c:var(--line);--cd:var(--line-d);color:var(--muted);cursor:default}
.btn.mint{--c:var(--mint);--cd:var(--mint-d)} .btn.coral{--c:var(--coral);--cd:var(--coral-d)}
.btn.sun{--c:var(--sun);--cd:var(--sun-d);color:#3A2A00}
.btn.plain{--c:var(--card);--cd:var(--line-d);color:var(--sky);border:2px solid var(--line-d)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.logo{margin:0;font-weight:900;font-size:1.5rem;letter-spacing:.02em;cursor:pointer;line-height:1.2}
.logo span{color:var(--sky)}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.95rem;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px;flex:none}

/* mascot bubble */
.hello{display:flex;align-items:flex-end;gap:12px}
.hello svg{width:84px;height:84px;flex:none}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble small{display:block;color:var(--muted);font-weight:500;font-size:.85rem}

/* category list */
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.cat:hover{border-color:var(--c)}
.cat:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.badge{position:relative;width:58px;height:58px;flex:none;display:grid;place-items:center}
.badge svg{position:absolute;inset:0;transform:rotate(-90deg)}
.badge b{width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:1.3rem;box-shadow:0 3px 0 var(--cd)}
.cat .t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.45}
.cat .t b{font-size:1.05rem;font-weight:800}
.cat .t small{color:var(--muted);font-size:.83rem}
.cat .pct{font-weight:900;color:var(--c);font-size:.95rem;font-variant-numeric:tabular-nums;flex:none}
.c-kihon{--c:var(--sky);--cd:var(--sky-d)} .c-kenri{--c:var(--grape);--cd:var(--grape-d)}
.c-kikan{--c:var(--sun);--cd:var(--sun-d)} .c-reigai{--c:var(--mint);--cd:var(--mint-d)}
.c-shingai{--c:var(--coral);--cd:var(--coral-d)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 200px}
.note{font-size:.78rem;color:var(--muted);margin:6px 0 0;line-height:1.6}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;padding:4px;color:var(--muted);flex:none;display:grid;place-items:center}
.x svg{width:24px;height:24px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;min-width:16px;border-radius:999px;background:var(--mint);position:relative;transition:width .35s cubic-bezier(.3,1.4,.6,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.combo{display:flex;align-items:center;gap:3px;font-weight:900;color:var(--sun-d);font-variant-numeric:tabular-nums;flex:none;min-width:44px;justify-content:flex-end}
.combo svg{width:20px;height:20px}
.combo.off{color:var(--muted);opacity:.5}
.kind{display:inline-flex;align-self:flex-start;font-weight:800;font-size:.8rem;letter-spacing:.08em;color:var(--c);background:var(--card);border:2px solid var(--c);border-radius:999px;padding:1px 12px}
.q{font-size:1.3rem;font-weight:800;margin:0;line-height:1.55;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 4px 0 var(--line);font-weight:700;line-height:1.5;transition:transform .06s,box-shadow .06s,border-color .1s,background .1s}
.choice .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:800}
.choice:hover:not(:disabled){background:var(--bg)}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.choice.sel{border-color:var(--sky);background:var(--sky-t);box-shadow:0 4px 0 var(--sky);color:var(--sky-d)}
.choice.sel .k{border-color:var(--sky);color:var(--sky)}
.choice.correct{border-color:var(--mint);background:var(--mint-t);box-shadow:0 4px 0 var(--mint)}
.choice.correct .k{border-color:var(--mint);background:var(--mint);color:var(--on)}
.choice.wrong{border-color:var(--coral);background:var(--coral-t);box-shadow:0 4px 0 var(--coral)}
.choice.wrong .k{border-color:var(--coral);background:var(--coral);color:var(--on)}
.choice:disabled{cursor:default}
.choice:disabled:not(.correct):not(.wrong){opacity:.5}
.tf{flex-direction:row}
.tf .choice{flex:1;flex-direction:column;justify-content:center;gap:0;padding:18px 10px}
.tf .choice .k{display:none}
.tf .choice .mk{font-size:2.6rem;font-weight:900;line-height:1.1}
.tf .choice .lb{font-size:.85rem;color:var(--muted)}
.tf .choice.sel .lb{color:var(--sky-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .choice.sel{color:var(--sky)} :root:not([data-theme="light"]) .tf .choice.sel .lb{color:var(--sky)}}
:root[data-theme="dark"] .choice.sel{color:var(--sky)}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .35s} .bounce{animation:bounce .4s}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes bounce{40%{transform:scale(1.04)}}

/* bottom bar / feedback sheet */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .2s}
.dock .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.dock.ok{background:var(--mint-t);border-top-color:transparent}
.dock.ng{background:var(--coral-t);border-top-color:transparent}
.fb-head{display:flex;align-items:center;gap:10px}
.fb-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card)}
.fb-icon svg{width:24px;height:24px}
.fb-title{font-weight:900;font-size:1.35rem;line-height:1.3}
.dock.ok .fb-title{color:var(--mint-d)} .dock.ng .fb-title{color:var(--coral-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dock.ok .fb-title{color:var(--mint)} :root:not([data-theme="light"]) .dock.ng .fb-title{color:var(--coral)}}
:root[data-theme="dark"] .dock.ok .fb-title{color:var(--mint)} :root[data-theme="dark"] .dock.ng .fb-title{color:var(--coral)}
.fb-ans{font-weight:800}
.ref{align-self:flex-start;font-weight:800;font-size:.82rem;background:var(--card);border-radius:8px;padding:2px 10px;border:2px solid var(--line)}
.fb-exp{margin:0;font-size:.95rem;line-height:1.75}
@media (prefers-reduced-motion:no-preference){.dock.ok,.dock.ng{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.xp-pop{font-weight:900;color:var(--sun-d);margin-left:auto;font-size:1rem}

/* result */
.done{text-align:center;align-items:center}
.done svg.mascot{width:130px;height:130px}
.done h2{margin:0;font-size:1.8rem;font-weight:900;color:var(--sun-d);text-wrap:balance}
.done p{margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--c)}
.tile span{display:block;color:var(--on);font-weight:800;font-size:.75rem;letter-spacing:.06em;padding:3px 0}
.tile b{display:block;background:var(--card);font-size:1.4rem;font-weight:900;padding:10px 4px;color:var(--c);font-variant-numeric:tabular-nums;border-radius:12px 12px 0 0}
.tile.sun{--c:var(--sun-d)} .tile.mint{--c:var(--mint)} .tile.coral{--c:var(--coral)}
.missed{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;text-align:left;width:100%}
.missed li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.missed .mq{font-weight:800}
.missed .ma{font-size:.92rem}
.missed .ma b{color:var(--mint-d)}
.missed .me{font-size:.86rem;color:var(--muted);margin:0}
h3{margin:8px 0 0;font-size:1.1rem;font-weight:900;align-self:flex-start}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
@media (max-width:520px){.hint{display:none}.q{font-size:1.15rem}}
.c-sky{--c:var(--sky);--cd:var(--sky-d)} .c-grape{--c:var(--grape);--cd:var(--grape-d)}
.c-sun{--c:var(--sun);--cd:var(--sun-d)} .c-mint{--c:var(--mint);--cd:var(--mint-d)}
.c-coral{--c:var(--coral);--cd:var(--coral-d)}
.tile.sky{--c:var(--sky)}
.exam-card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--sun-t);border:2px solid var(--sun);border-radius:18px;padding:14px;box-shadow:0 5px 0 var(--sun-d);transition:transform .06s,box-shadow .06s}
.exam-card:active{transform:translateY(5px);box-shadow:0 0 0 var(--sun-d)}
.exam-badge{width:52px;height:52px;flex:none;border-radius:50%;background:var(--sun);color:#3A2A00;display:grid;place-items:center;box-shadow:0 3px 0 var(--sun-d)}
.exam-badge svg{width:28px;height:28px}
.exam-card .t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.45}
.exam-card .t b{font-size:1.05rem;font-weight:900}
.exam-card .t small{color:var(--muted);font-size:.83rem}
.exam-card .pct{font-weight:900;color:var(--sun-d);flex:none;font-variant-numeric:tabular-nums}
h3.sec{display:flex;align-items:baseline;gap:8px;margin:4px 0 -4px}
h3.sec small{font-size:.8rem;color:var(--muted);font-weight:700}
.clock{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.clock svg{width:20px;height:20px;color:var(--sky)}
.clock.warn{color:var(--coral)} .clock.warn svg{color:var(--coral)}
.verdict{display:inline-block;font-weight:900;font-size:.9rem;letter-spacing:.1em;padding:4px 16px;border-radius:999px;color:var(--on)}
.verdict.pass{background:var(--mint);box-shadow:0 3px 0 var(--mint-d)}
.verdict.fail{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.tbl{width:100%;overflow-x:auto}
table.break{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;font-size:.9rem;text-align:left}
table.break td{padding:8px 12px;border-bottom:1px solid var(--line)}
table.break tr:last-child td{border-bottom:0}
table.break td.num{white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
table.break td:last-child{width:35%}
.meter{display:block;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:999px}
</style>
</head>
<body>

<div class="wrap">
  <main id="app"></main>
</div>
<div class="dock" id="dock" hidden><div class="in" id="dock-in"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
const CATS = {
  kiso:  {name:"基礎知識",       k:"基", col:"sky",   desc:"契約・所有権・知的財産権"},
  mono:  {name:"著作物",         k:"物", col:"grape", desc:"何が保護され、何が保護されないか"},
  sha:   {name:"著作者",         k:"者", col:"sun",   desc:"職務著作・映画の著作者"},
  jin:   {name:"著作者人格権",   k:"人", col:"coral", desc:"公表権・氏名表示権・同一性保持権"},
  shi:   {name:"著作権（支分権）", k:"支", col:"mint",  desc:"複製権・公衆送信権・譲渡権など"},
  sei:   {name:"著作権の制限",   k:"制", col:"sky",   desc:"私的複製・引用・教育・AI学習"},
  ki:    {name:"保護期間・譲渡・登録", k:"期", col:"grape", desc:"死後70年、権利の移転と登録"},
  rin:   {name:"著作隣接権",     k:"隣", col:"sun",   desc:"実演家・レコード・放送"},
  shin:  {name:"侵害と救済",     k:"侵", col:"coral", desc:"みなし侵害・差止め・刑事罰"},
  jitsu: {name:"周辺の権利と実務", k:"実", col:"mint",  desc:"肖像権・条約・委託契約・情報モラル"}
};
const TF = ["○ 正しい","× 誤り"];
// T: ○×問題（ok=trueなら「正しい」が正解） / M: 選択問題（aは正解の番号、0始まり）
const T = (c,q,ok,ref,e) => ({c,q,ch:TF,a:ok?0:1,tf:true,ref,e});
const M = (c,q,ch,a,ref,e) => ({c,q,ch,a,ref,e});
const Q = [
/* ===== 1. 基礎知識（契約・所有権・知的財産権） ===== */
T("kiso","契約は、契約書を作らなくても口頭の合意だけで原則として成立する。",true,"民法第522条","契約は申込みと承諾が合えば成立し、原則として書面は必要ありません。契約書は、合意の内容をはっきりさせ、後の争いで証拠にするために作ります。"),
T("kiso","契約の効力は、原則として契約を結んだ当事者の間にしか及ばない。",true,"契約の効力範囲","契約は当事者を拘束するもので、契約に関わっていない第三者を当然に縛るものではありません。著作権の譲渡を第三者に主張するために登録制度があるのはこのためです。"),
T("kiso","有名な画家の絵画の原画を買えば、その絵の著作権も一緒に手に入る。",false,"第17条／最判昭和59年1月20日","原画という「物」の所有権と、表現という「無体物」に対する著作権は別の権利です。原画を買っても、複製やネット掲載をする権利は画家に残ります。"),
M("kiso","美術の著作物の原作品を、許諾なしに公に展示できるのは誰？",["原作品の所有者（またはその同意を得た者）","原作品を撮影した写真家","展示会場の運営者なら誰でも","美術館の来館者"],0,"第45条","原作品の所有者やその同意を得た人は、原作品を展示できます。ただし、公園など屋外の場所に恒常的に設置する場合は、著作権者の許諾が必要です。"),
T("kiso","著作権も所有権と同じように、権利者が他人の利用を排除できる性質（物権的な性質）を持つ。",true,"著作権と所有権","どちらも特定の相手だけでなく誰に対しても主張できる、排他的な権利です。違いは、所有権が「物」、著作権が形のない「表現」を対象とする点です。"),
M("kiso","産業財産権（工業所有権）に含まれないものは？",["特許権","実用新案権","意匠権","著作権"],3,"知的財産権の分類","産業財産権は特許権・実用新案権・意匠権・商標権の4つで、特許庁への出願と登録が必要です。著作権は知的財産権の一つですが、産業財産権には含まれません。"),
M("kiso","著作権と特許権の違いとして正しいものは？",["著作権は登録不要で発生し、特許権は出願・登録が必要","どちらも文化庁への登録で発生する","どちらも特許庁への出願が必要","著作権は出願が必要で、特許権は自動的に発生する"],0,"第17条2項／特許法第66条","著作権は創作と同時に自動的に発生します（無方式主義）。特許権は特許庁に出願し、審査を経て登録されることで発生します。"),
T("kiso","他人の作品を知らずに、偶然そっくりな作品を独自に創作しても、著作権侵害にはならない。",true,"最判昭和53年9月7日","著作権侵害には、既存の作品をもとにしたこと（依拠性）が必要です。独自に作ったものが偶然似ても侵害にはなりません。この点は、知らずに同じ発明をしても侵害になる特許権と異なります。"),
M("kiso","特許権の存続期間は、原則としてどれだけ？",["出願の日から20年","登録の日から10年","発明者の死後70年","期限なし"],0,"特許法第67条","特許権は原則として出願の日から20年で終わります。著作権の保護期間（原則として著作者の死後70年）と比べると、ずっと短い期間です。"),
T("kiso","「著作権」という言葉は、著作者人格権や著作隣接権まで含めた広い意味で使われることもある。",true,"「著作権」の意味","狭い意味の「著作権」は、複製権などの財産的な権利を指します。日常的には、著作者人格権や著作隣接権まで含めた総称として使われることもあるため、文脈で判断します。"),
T("kiso","日本で著作権を得るには、文化庁への登録か©マークの表示のどちらかが必要である。",false,"第17条2項","著作権は作品を創作した時点で自動的に発生します（無方式主義）。登録も©表示も公表も不要です。文化庁の登録制度は、権利の移転を第三者に主張する場面などで使うもので、権利を生む手続ではありません。"),

/* ===== 2. 著作物 ===== */
T("mono","「アイデアそのもの」は著作権で保護される。",false,"第2条1項1号","保護されるのは具体的な「表現」で、アイデアや手法そのものは保護されません。同じトリックを使った別の推理小説を書いても、文章表現を真似していなければ侵害になりません。"),
M("mono","次のうち、著作物にあたらないものはどれ？",["小学生が描いた絵","台本なしの講演","事実だけを短く伝える人事異動の記事","SNSに書いた短い詩"],2,"第10条2項","事実を伝えるだけの雑報や時事報道は著作物にあたりません。一方で、創作性があれば子どもの絵も、口頭の講演も、短い詩も著作物です。上手さや芸術的価値は問われません。"),
M("mono","著作権法の「著作物」の定義に含まれていない要素は？",["思想又は感情を含む","創作的である","表現したものである","芸術的な価値が高い"],3,"第2条1項1号","定義は「思想又は感情を創作的に表現したもので、文芸・学術・美術・音楽の範囲に属するもの」。作品の出来の良さや価値の高さは要件ではありません。"),
T("mono","本や曲のタイトルは、ふつう単独で著作物として保護される。",false,"裁判例／第20条1項","短いタイトルは創作性が認められにくく、裁判例でも著作物性は否定される傾向です。ただし、作品の中のタイトルを無断で変えることは著作者の同一性保持権の問題になります。"),
T("mono","写真は機械で撮るものなので、著作物にはならない。",false,"第10条1項8号","構図、光の加減、シャッターチャンスなどに撮影者の個性が表れるため、写真は著作物になりえます。写真の著作物は著作物の例示にも挙げられています。"),
M("mono","著作権法の「著作物の例示」に挙げられていないものは？",["舞踊又は無言劇の著作物","建築の著作物","プログラムの著作物","料理の味"],3,"第10条1項","例示は、言語・音楽・舞踊又は無言劇・美術・建築・地図又は図形・映画・写真・プログラムの9種類です。料理の味は表現ではないため著作物になりません。"),
T("mono","プログラムの著作物の保護は、プログラム言語・規約（プロトコル）・解法（アルゴリズム）には及ばない。",true,"第10条3項","保護されるのは具体的に書かれたプログラムの表現です。言語やプロトコル、アルゴリズムは、ほかの人も使える道具や考え方として保護の対象外とされています。"),
M("mono","「権利の目的とならない著作物」（誰でも自由に使えるもの）にあたらないものは？",["憲法・法令","裁判所の判決","国の告示・通達","市が作った広報誌の特集記事"],3,"第13条／第32条2項","法令・告示・判決などは自由に使えます。自治体の広報誌の記事は通常の著作物ですが、一般に周知させるための広報資料は、転載禁止の表示がなければ新聞や雑誌などに説明の材料として転載できます。"),
M("mono","二次的著作物にあたるものは？",["小説を英語に翻訳したもの","絵画をそのまま機械的に撮影した写真","新聞記事の見出しを並べた一覧","自分が書いた日記"],0,"第2条1項11号","二次的著作物は、既存の著作物を翻訳・編曲・変形・脚色・映画化などして新たに創作したものです。そのまま撮影しただけの写真には新たな創作性がないため、二次的著作物にはなりません。"),
M("mono","編集著作物として保護されるための条件は？",["素材の選択または配列に創作性があること","素材の数が多いこと","素材がすべて著作物であること","編集に多額の費用がかかったこと"],0,"第12条","百科事典や新聞のように、どの素材を選びどう並べるかに創作性があれば編集著作物になります。素材そのものは著作物でなくてもかまいません。"),
T("mono","電話番号を五十音順に並べただけのデータベースでも、必ず著作物として保護される。",false,"第12条の2","データベースは、情報の選択または体系的な構成に創作性があるときに著作物となります。五十音順のようなありふれた並べ方だけでは創作性は認められにくいです。"),
M("mono","共同著作物にあたるものは？",["2人で議論しながら書き、分担部分を分けられない小説","作詞家と作曲家がそれぞれ作った歌の詞と曲","雑誌に載った複数の作家の短編","原作の小説とそれを映画化した作品"],0,"第2条1項12号","共同著作物は、2人以上が共同で創作し、各人の寄与を分けて別々に使えないものです。詞と曲のように分けて使えるものは「結合著作物」と呼ばれ、それぞれ独立した著作物です。"),
T("mono","大量生産される実用品のデザインでも、美術の著作物として保護される場合がある。",true,"第2条2項／裁判例","実用品のデザイン（応用美術）は主に意匠法で保護されますが、裁判例では、美的な鑑賞の対象になる創作性があるなどの場合に著作物と認めたものがあります。"),
T("mono","地図は事実を表したものなので、著作物になることはない。",false,"第10条1項6号","地図は例示にも挙げられている著作物です。どの情報を選び、どう表現するかに作成者の個性が表れるためです。"),

/* ===== 3. 著作者 ===== */
M("sha","著作権法上の「著作者」になるのは誰？",["作品を創作した人","制作費を出した人","アイデアを出しただけの人","作品を発注した会社"],0,"第2条1項2号","著作者は著作物を創作した人です。お金を出した人やアイデアを出しただけの人は、原則として著作者にはなりません（職務著作などの例外があります）。"),
T("sha","本の表紙に著者として名前が表示されている人は、その本の著作者と推定される。",true,"第14条","原作品や、公衆に提供・提示するときに氏名が通常の方法で表示されている人は著作者と推定されます。推定なので、反対の証拠があればくつがえります。"),
T("sha","ペンネームで表示されている場合は、どれほど広く知られた名前でも、著作者の推定は働かない。",false,"第14条","推定の対象は実名だけでなく、周知の変名（ペンネームや芸名など）も含まれます。"),
M("sha","会社員が会社の指示で業務用プログラムを作った。契約などに特別な定めがなければ、著作者は誰？",["作った社員","会社","社員と会社の共有","発注した取引先"],1,"第15条2項","職務著作の要件を満たせば、会社が著作者になります。プログラムの場合は、会社名義で公表することも要件になりません。"),
M("sha","職務著作（法人著作）の要件にあたらないものは？",["法人等の発意にもとづくこと","業務に従事する者が職務上作成すること","法人等の名義で公表すること（プログラム以外）","法人等が作成費用を負担すること"],3,"第15条1項","要件は、法人の発意・業務に従事する者が職務上作成・法人名義での公表・契約や就業規則に別段の定めがないこと、です。費用負担は要件ではありません。"),
T("sha","外部のフリーランスに発注したイラストは、契約に何も書かなくても、発注した会社が著作者になる。",false,"第15条","外部への委託（請負）では、作った人は会社の業務に従事する者ではないため職務著作になりません。契約で定めがなければ、著作者も著作権もイラストレーターにあります。"),
T("sha","職務著作が成立すると、会社が著作者となり、著作者人格権も会社が持つ。",true,"第15条","職務著作では法人そのものが著作者になるため、著作権だけでなく著作者人格権も法人が持ちます。"),
M("sha","映画の著作物の著作者に含まれない人は？",["監督","撮影監督","美術監督","原作小説の作者"],3,"第16条","映画の著作者は、制作・監督・演出・撮影・美術などで映画全体の形成に創作的に寄与した人です。原作・脚本・音楽の作者は映画の著作者ではなく、それぞれ自分の著作物の著作者として権利を持ちます。"),
M("sha","映画の著作者が製作への参加を約束していた場合、映画の著作権は誰のものになる？",["映画製作者（製作会社など）","監督","主演俳優","配給会社"],0,"第29条1項","監督などの著作者が映画製作者に対して製作への参加を約束しているときは、映画の著作権は映画製作者に帰属します。多額の投資をした製作者が作品を流通させやすくするための規定です。"),
T("sha","映画の著作権が映画製作者に帰属すると、監督の著作者人格権も映画製作者に移る。",false,"第16条・第29条","第29条で移るのは著作権（財産権）だけです。著作者は監督などのままなので、著作者人格権は監督などに残ります。"),

/* ===== 4. 著作者人格権 ===== */
M("jin","著作者人格権に含まれないものは？",["公表権","氏名表示権","同一性保持権","複製権"],3,"第18条〜第20条","著作者人格権は、公表するかどうか・名前をどう出すか・内容を勝手に変えさせないか、の3つ。複製権は財産的な権利（著作権）の一つです。"),
T("jin","著作者人格権は、契約によって他人に譲渡できる。",false,"第59条","著作者人格権は著作者本人だけに属し、譲渡できません。そのため実務では「著作者人格権を行使しない」という特約を契約に入れることが多くあります。"),
T("jin","公表権は、すでに公表された作品についても、改めて公表を止めさせることができる権利である。",false,"第18条1項","公表権は、未公表の著作物を公表するかどうか、いつ・どのように公表するかを決める権利です。すでに公表された作品には働きません。"),
T("jin","未公表の著作物の著作権を譲渡すると、その著作物の公表に同意したものと推定される。",true,"第18条2項1号","著作権を譲り受けた人が作品を利用できるよう、譲渡した時点で公表に同意したと推定されます。"),
M("jin","氏名表示権で著作者が決められないことは？",["実名で表示する","ペンネームで表示する","名前を表示しない","作品の販売価格"],3,"第19条","氏名表示権は、作品に実名を出すか、変名を出すか、何も出さないかを決める権利です。"),
T("jin","作品の題号（タイトル）を無断で変えることも、同一性保持権の侵害になりうる。",true,"第20条1項","同一性保持権は、著作物と題号について、著作者の意に反する変更・切除などの改変を受けない権利です。"),
M("jin","同一性保持権の例外として、著作者の意に反しても許される改変ではないものは？",["教科書に載せるための、やむを得ない用字・用語の変更","建築物の増築・改築","プログラムのバグ修正","小説の結末を面白くするための書き換え"],3,"第20条2項","例外は、教科書等でのやむを得ない用字変更、建築物の増改築・修繕、プログラムのバグ修正やバージョンアップ、その他やむを得ない改変に限られます。"),
T("jin","著作者が亡くなれば著作者人格権は消えるので、死後は作品を自由に改変してよい。",false,"第60条","著作者の死後も、生きていれば著作者人格権の侵害になるような行為は原則として禁止されます。違反に対しては遺族が差止めなどを請求できます。"),
T("jin","著作者の死後、人格的利益を守るために差止めなどを請求できる遺族には、配偶者・子・父母・孫・祖父母・兄弟姉妹が含まれる。",true,"第116条","請求できる遺族はこの範囲で、原則としてこの順番で優先されます。著作者が遺言で別の人を指定することもできます。"),
M("jin","著作者人格権の侵害に対して、特に認められている請求は？",["謝罪広告など名誉回復等の措置","相手の著作権の没収","著作権登録の取消し","特許の無効審判"],0,"第115条","著作者人格権の侵害には、差止めや損害賠償に加えて、謝罪広告の掲載など名誉や声望を回復するための措置を求めることができます。"),
T("jin","著作権（財産権）を他人に譲渡した後も、著作者人格権は著作者のもとに残る。",true,"第59条","著作権を譲渡しても、著作者人格権は譲渡できないので著作者に残ります。譲受人が改変などをしたい場合は、不行使特約などで手当てしておく必要があります。"),
M("jin","著作権の譲渡契約で、発注者が後から作品を自由に手直しできるようにするために入れる定番の条項は？",["著作者人格権を行使しない旨の特約","著作者人格権を譲渡する旨の条項","著作者人格権を放棄する旨の登録","著作権を共有にする条項"],0,"第59条・実務","著作者人格権は譲渡できないため、「著作者は著作者人格権を行使しない」という不行使特約を入れるのが実務の定番です。"),

/* ===== 5. 著作権（支分権） ===== */

T("shi","著作権法の「公衆」は不特定の人だけを指し、会員制のように特定された人は何人いても公衆にあたらない。",false,"第2条5項","公衆は「不特定の人」のほか「特定かつ多数の人」も含みます。会員制でも人数が多ければ公衆にあたります。"),
T("shi","講演を録音することも、著作権法上の「複製」にあたる。",true,"第2条1項15号","複製は印刷・写真・複写・録音・録画などで有形的に再製することです。講演や演奏を録音・録画することも含まれます。"),
T("shi","自宅で一人で他人の曲をピアノで弾くと、演奏権の侵害になる。",false,"第22条","演奏権は、公衆に直接聞かせることを目的として演奏する権利です。自宅で一人で弾くのは公衆に向けたものではないので、演奏権は働きません。"),
M("shi","店内の大型モニターで、映画のDVDを客に見せるときに働く権利は？",["上映権","口述権","展示権","頒布権"],0,"第22条の2","上映権は、著作物をスクリーンやディスプレイに映して公衆に見せる権利です。映画に限らず、写真や資料を映す場合も含まれます。"),
T("shi","サーバーにアップロードして誰でもアクセスできる状態にしただけで、まだ誰も見ていなくても、公衆送信権の侵害になりうる。",true,"第23条1項","公衆送信権には、いつでも送信できる状態にする「送信可能化」が含まれます。アクセスの有無にかかわらず、アップロードした時点で権利が働きます。"),
M("shi","小説を公衆の前で朗読するときに働く権利は？",["口述権","上演権","展示権","貸与権"],0,"第24条","口述権は、言語の著作物を朗読などの方法で公衆に伝える権利です。"),

M("shi","頒布権が認められているのは、どの著作物？",["映画の著作物","言語の著作物","音楽の著作物","写真の著作物"],0,"第26条","頒布権は映画の著作物だけに認められた、譲渡と貸与の両方を含む権利です。映画以外の著作物には、譲渡権と貸与権が別々に定められています。"),

function ring(p){
  const r=26,c=2*Math.PI*r,v=Math.max(0,Math.min(1,(p||0)/100));
  return `<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--c)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*v} ${c}"/></svg>`;
}

function start(cat){
  let qs;
  const prep = q => ({...q,order:q.tf?[0,1]:shuffle(q.ch.map((_,i)=>i))});
  if(cat==="exam"){
    qs = shuffle(Object.keys(CATS).flatMap(k=>shuffle(Q.filter(q=>q.c===k)).slice(0,EXAM.per))).map(prep);
  }else{
    let pool;
    if(cat==="all") pool=Q;
    else if(cat==="weak"){const w=store.get("weak",[]);pool=Q.filter(q=>w.includes(q.id))}
    else if(cat==="retry") pool=S.missed;
    else pool=Q.filter(q=>q.c===cat);
    qs=shuffle(pool).slice(0,LIMIT).map(prep);
  }
  const exam = cat==="exam";
  S={cat:cat==="retry"?(S.cat==="exam"?"all":S.cat):cat,exam,qs,i:0,score:0,combo:0,maxCombo:0,missed:[],answers:[],sel:null,checked:false,xp:0,
     deadline: exam ? Date.now()+EXAM.minutes*60000 : 0};
  stopTimer();
  if(exam){timer=setInterval(tick,500)}
  render();
}
function tick(){
  if(!S||!S.exam) return stopTimer();
  const left=(S.deadline-Date.now())/1000, el=document.getElementById("clock");
  if(el){el.lastChild.textContent=mmss(left); el.classList.toggle("warn",left<300)}
  if(left<=0){stopTimer(); result(true)}
}

function render(){
  const q=S.qs[S.i], n=S.qs.length, col=CATS[q.c].col;
  S.sel=null; S.checked=false;
  const right = S.exam
    ? `<span class="clock" id="clock" title="残り時間">${ICON.clock}<span>${mmss((S.deadline-Date.now())/1000)}</span></span>`
    : `<span class="combo ${S.combo<2?"off":""}" title="連続正解">${ICON.flame}${S.combo}</span>`;
  app.innerHTML = `<div class="stack">
    <div class="qtop">
      <button class="x" id="quit" aria-label="やめてホームに戻る">${ICON.close}</button>
      <div class="prog"><i style="width:${(S.i/n)*100}%"></i></div>
      ${right}
    </div>
    <span class="kind c-${col}">${S.exam?`模擬試験 第${S.i+1}問／${n}`:CATS[q.c].name}${q.tf?"・○×":""}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="choices ${q.tf?"tf":""}" id="choices">
      ${q.order.map((ci,k)=>q.tf
        ? `<button class="choice" data-ci="${ci}"><span class="mk">${ci===0?"○":"×"}</span><span class="lb">${ci===0?"正しい":"誤り"}</span></button>`
        : `<button class="choice" data-ci="${ci}"><span class="k">${k+1}</span><span>${esc(q.ch[ci])}</span></button>`).join("")}
    </div>
    <p class="hint">キーボード：<b>1</b>〜<b>${q.order.length}</b> で選択、<b>Enter</b> で${S.exam?"回答":"チェック／つづける"}</p>
  </div>`;
  document.getElementById("quit").onclick=home;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.ci));
  dock.hidden=false; dock.className="dock";
  dockIn.innerHTML=`<button class="btn mint" id="check" disabled>${S.exam?(S.i===n-1?"回答して採点する":"回答して次へ"):"チェック"}</button>`;
  document.getElementById("check").onclick=check;
  requestAnimationFrame(()=>{app.style.paddingBottom=(dock.offsetHeight+16)+"px"});
  window.scrollTo({top:0});
}

function pick(ci){
  if(S.checked) return;
  S.sel=ci;
  app.querySelectorAll(".choice").forEach(b=>b.classList.toggle("sel",+b.dataset.ci===ci));
  document.getElementById("check").disabled=false;
}

function record(q,ok){
  if(ok){S.score++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.xp+=XP_PER}
  else{S.combo=0;S.missed.push(q)}
  S.answers.push({q,ok});
  const weak=new Set(store.get("weak",[])); ok?weak.delete(q.id):weak.add(q.id); store.set("weak",[...weak]);
}

function check(){
  if(S.checked||S.sel==null) return;
  S.checked=true;
  const q=S.qs[S.i], ok=S.sel===q.a, n=S.qs.length;
  record(q,ok);
  if(S.exam){ next(); return; }
  app.querySelectorAll(".choice").forEach(b=>{
    const c=+b.dataset.ci; b.disabled=true; b.classList.remove("sel");
    if(c===q.a){b.classList.add("correct"); if(ok) b.classList.add("bounce")}
    else if(c===S.sel){b.classList.add("wrong","shake")}
  });
  app.querySelector(".prog i").style.width=((S.i+1)/n*100)+"%";
  const cb=app.querySelector(".combo"); cb.classList.toggle("off",S.combo<2); cb.innerHTML=ICON.flame+S.combo;
  const last=S.i===n-1;
  const title = ok ? (S.combo>=3?`${S.combo}問連続正解だ！`:PRAISE[Math.floor(Math.random()*PRAISE.length)]) : "おしい！条文を確認しとけ";
  dock.className="dock "+(ok?"ok":"ng");
  dockIn.innerHTML=`
    <div class="fb-head"><span class="fb-icon">${ok?ICON.check:ICON.cross}</span><span class="fb-title">${title}</span>${ok?`<span class="xp-pop">+${XP_PER} XP</span>`:""}</div>
    ${ok?"":`<div class="fb-ans">正解：${esc(q.ch[q.a])}</div>`}
    <span class="ref">${esc(q.ref)}</span>
    <p class="fb-exp">${esc(q.e)}</p>
    <button class="btn ${ok?"mint":"coral"}" id="next">${last?"結果を見る":"つづける"}</button>`;
  dockIn.scrollTop=0;
  const nx=document.getElementById("next"); nx.onclick=next; nx.focus({preventScroll:true});
  requestAnimationFrame(()=>{app.style.paddingBottom=(dock.offsetHeight+16)+"px"});
}

function next(){ if(S.i<S.qs.length-1){S.i++;render()} else result(false) }

function missedList(list){
  return `<ul class="missed">${list.map(q=>`<li>
    <span class="ref">${esc(q.ref)}</span><span class="mq">${esc(q.q)}</span>
    <span class="ma">正解：<b>${esc(q.ch[q.a])}</b></span><p class="me">${esc(q.e)}</p></li>`).join("")}</ul>`;
}

function result(timeUp){
  stopTimer(); hideDock();
  // 時間切れのときは、未回答の問題を不正解として扱う
  if(timeUp) S.qs.slice(S.answers.length).forEach(q=>{S.missed.push(q);S.answers.push({q,ok:false,blank:true})});
  const n=S.qs.length, pct=Math.round(S.score/n*100);
  store.set("xp",store.get("xp",0)+S.xp);
  const s=store.get("streak",{n:0,last:null}), t=today();
  if(s.last!==t){const gap=s.last?(new Date(t)-new Date(s.last))/864e5:99; s.n=gap<=1?s.n+1:1; s.last=t; store.set("streak",s)}

  if(S.exam){
    const passed = S.score/n*100 >= EXAM.pass, need=Math.ceil(n*EXAM.pass/100);
    const ex=store.get("exam",{best:0,count:0,passes:0}); ex.best=Math.max(ex.best,pct); ex.count++; if(passed) ex.passes++; store.set("exam",ex);
    const used = Math.min(EXAM.minutes*60, EXAM.minutes*60-(S.deadline-Date.now())/1000);
    const rows = Object.entries(CATS).map(([k,v])=>{
      const a=S.answers.filter(x=>x.q.c===k), ok=a.filter(x=>x.ok).length;
      return `<tr><td>${v.name}</td><td class="num">${ok} / ${a.length}</td><td><span class="meter c-${v.col}"><i style="width:${a.length?ok/a.length*100:0}%"></i></span></td></tr>`;
    }).join("");
    app.innerHTML = `<div class="stack done">
      ${mascot(passed?"wow":"sad")}
      <span class="verdict ${passed?"pass":"fail"}">${passed?"合格ライン突破":"あと一歩"}</span>
      <h2>${S.score} / ${n} 問正解</h2>
      <p>${timeUp?"時間切れだ。未回答の問題は不正解として採点したぞ。":""}合格ラインは${n}問中${need}問（正答率${EXAM.pass}%）。${passed?"この調子なら本番もいけるぜ！":`あと${need-S.score}問だ。弱い分野を集中的に鍛えろ！`}</p>
      <div class="tiles">
        <div class="tile ${passed?"mint":"coral"}"><span>正答率</span><b>${pct}%</b></div>
        <div class="tile sun"><span>かかった時間</span><b>${mmss(used)}</b></div>
        <div class="tile sky"><span>獲得XP</span><b>${S.xp}</b></div>
      </div>
      <h3>分野別の結果</h3>
      <div class="tbl"><table class="break"><tbody>${rows}</tbody></table></div>
      <div class="row" style="width:100%">
        ${S.missed.length?`<button class="btn coral" id="retry">間違えた問題を解き直す</button>`:""}
        <button class="btn plain" id="again">ホームにもどる</button>
      </div>
      ${S.missed.length?`<h3>間違えた問題（${S.missed.length}問）</h3>${missedList(S.missed)}`:""}
    </div>`;
    if(passed) confetti();
  }else{
    if(S.cat in CATS){const best=store.get("best",{});if(best[S.cat]==null||pct>best[S.cat]){best[S.cat]=pct;store.set("best",best)}}
    const head = pct===100?"パーフェクトだ！":pct>=70?"レッスン完了！":"おつかれさん！";
    const msg = pct===100?"全問正解。条文の根拠までばっちりだな。":pct>=70?"いい調子だ。間違えた問題の条文をもう一度見ておけ。":"解説を読み直して、間違えた問題にもう一度挑め！";
    app.innerHTML = `<div class="stack done">
      ${mascot(pct>=70?"wow":"happy")}
      <h2>${head}</h2>
      <p>${msg}</p>
      <div class="tiles">
        <div class="tile sun"><span>獲得XP</span><b>${S.xp}</b></div>
        <div class="tile mint"><span>正答率</span><b>${pct}%</b></div>
        <div class="tile coral"><span>最大コンボ</span><b>${S.maxCombo}</b></div>
      </div>
      <div class="row" style="width:100%">
        ${S.missed.length?`<button class="btn coral" id="retry">間違えた${S.missed.length}問にリベンジ</button>`:""}
        <button class="btn ${S.missed.length?"plain":""}" id="again">ホームにもどる</button>
      </div>
      ${S.missed.length?`<h3>間違えた問題</h3>${missedList(S.missed)}`:""}
    </div>`;
    if(pct>=70) confetti();
  }
  const r=document.getElementById("retry"); if(r) r.onclick=()=>start("retry");
  document.getElementById("again").onclick=home;
  window.scrollTo({top:0});
}

function confetti(){
  if(reduced) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.hidden=false; const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=["#1CA7EC","#FFC23D","#22C39A","#FF5C64","#8D6BF0"];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*5)]}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy*devicePixelRatio;p.vy+=.04;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t-t0<3200) requestAnimationFrame(f); else {ctx.clearRect(0,0,W,H);cv.hidden=true}
  })(t0);
}

document.addEventListener("keydown",e=>{
  if(!S||!document.getElementById("choices")) return;
  if(!S.checked){
    const k=parseInt(e.key,10), bs=app.querySelectorAll(".choice");
    if(k>=1&&k<=bs.length) bs[k-1].click();
    else if(e.key==="Enter"&&S.sel!=null){e.preventDefault();check()}
  }else if(!S.exam&&e.key==="Enter"&&document.activeElement?.id!=="next"){e.preventDefault();next()}
});
home();
</script>
</body>
</html>
